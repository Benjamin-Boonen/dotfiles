# battery information
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color8
    font_size = 21
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = right
    valign = bottom
}

