# INPUT FIELD
input-field {
    monitor =
    size = 200, 75
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(40, 40, 40, 0.1)
    inner_color = rgba(40, 40, 40, 0.05)
	capslock_color = rgb(255,255,255)
    font_color = $color7
    fade_on_empty = true
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = 0, 53
    halign = center
    valign = bottom
}

