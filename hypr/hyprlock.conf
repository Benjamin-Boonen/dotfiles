source = $HOME/dotfiles/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/dotfiles/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = $HOME/dotfiles/hypr/wallpaper_effects/.wallpaper_current
    blur_size = 4
    blur_passes = 1
    noise = 0.0117
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date)" </b>"
    color = $color13
    font_size = 27
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# Hour-Time (single horizontal time like 1080p variant)
label {
    monitor =
     text = cmd[update:1000] echo "$(date +"%H:%M")"   # 24h option
#    text = cmd[update:1000] echo "$(date +"%I:%M %p")" # AM/PM
	#color = rgba(255, 185, 0, .8)
    color = $color7
    font_size = 159
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, 70
    halign = center
    valign = center
}

