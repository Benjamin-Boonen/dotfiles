source= $HOME/dotfiles/hypr/monitors.conf
source= $HOME/dotfiles/hypr/User/UserKeybinds.conf
source= $HOME/dotfiles/hypr/User/UserSettings.conf
source= $HOME/dotfiles/hypr/User/Startup_Apps.conf
source= $HOME/dotfiles/hypr/workspaces.conf
source= $HOME/dotfiles/hypr/User/Animations.conf

input {
  kb_layout = us,be
  kb_options=grp:caps_toggle
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
  special_fallthrough = true # having only floating windows in the special workspace will not block focusing windows in the regular workspace.
  focus_on_close = 1 # focus will shift to the window under the cursor.
  tablet {
        output = HDMI-A-1           # map tablet to a specific monitor (check `hyprctl monitors` for names)
        # region_position = 0, 0    # if you want to map only part of the tablet area
        # region_size = 152, 95
        # rotation = 0
  }
}
device {
    name = syna30d2:00-06cb:ce08
    enabled = true
}

device {
    name = syna30d2:00-06cb:ce08-1
    enabled = false # this is the bich
}

device {
    name = syna30d2:00-06cb:ce08-2
    enabled = true
}
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_SIZE, 24

xwayland {
    use_nearest_neighbor = false
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
}

decoration {
  rounding = 6
  blur {
    enabled = false
  }
}

device {
    name = wacom-intuos-bt-s-pen
    output = HDMI-A-1
}
windowrule = noblur, class:menu.kando.Kando
windowrule = opaque, class:menu.kando.Kando
windowrule = size 100% 100%, class:menu.kando.Kando
windowrule = noborder, class:menu.kando.Kando
windowrule = noanim, class:menu.kando.Kando
windowrule = float, class:menu.kando.Kando
windowrule = pin, class:menu.kando.Kando

windowrulev2 = float, class:^(swayimg-blur-.*)$
windowrulev2 = pin, class:^(swayimg-blur-.*)$
windowrulev2 = fullscreen, class:^(swayimg-blur-.*)$
windowrulev2 = noborder, class:^(swayimg-blur-.*)$
windowrulev2 = animation popin 80%, class:^(swayimg-blur-.*)$

bind = Super, space, global, menu.kando.Kando:example-menu

exec-once = hypridle
exec-once = kando
