animations {
  enabled = yes

  # Bezier curves
  bezier = drift,    0.0, 0.85, 0.1, 1.0
  bezier = driftIn,  0.0, 0.9,  0.1, 1.05
  bezier = driftOut, 0.3, 0.0,  0.0, 1.0
  bezier = smooth,   0.4, 0.0,  0.2, 1.0
  bezier = liner,    1.0, 1.0,  1.0, 1.0

  # Windows
  animation = windows,     1, 5, driftIn,  popin 80%
  animation = windowsIn,   1, 5, driftIn,  popin 80%
  animation = windowsOut,  1, 4, driftOut, popin 80%
  animation = windowsMove, 1, 5, smooth,   slide

  # Borders
  animation = border,      1, 2, smooth
  animation = borderangle, 1, 180, liner, loop

  # Fade
  animation = fade,        1, 4, smooth
  animation = fadeIn,      1, 4, smooth
  animation = fadeOut,     1, 3, smooth

  # Workspaces
  animation = workspaces,    1, 4, smooth, slide
  animation = workspacesIn,  1, 4, smooth,  slide
  animation = workspacesOut, 1, 3, smooth, slide
}
