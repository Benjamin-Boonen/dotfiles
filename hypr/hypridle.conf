general {
    lock_cmd = pidof hyprlock || hyprlock
    on_lock_cmd = ~/dotfiles/hypr/shaders/toggle_blur.sh 
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 1740          # 5 min - 5 sec -> notif
    on-timeout = notify-send "Inactivity notification" "You've been inactive for 10 minutes, locking screen in 60 sec..."
}

listener {
    timeout = 1800          # 10 min -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 54000         # 30 min -> screen off 
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
